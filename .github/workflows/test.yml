
name: Test Postgkyl

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  install_and_test:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v3
    - name: Install ffmpeg
      run: sudo apt-get update && sudo apt-get install -y ffmpeg
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install postgkyl
      run: |
        # --no-build-isolation: the compiled gpython bridge must be built
        # against the same NumPy that ends up installed, not whichever NumPy
        # pip's isolated build environment independently resolves (see
        # README.md's "Installing Postgkyl" section).
        pip install numpy setuptools
        pip install -e .[test] --no-build-isolation
    - uses: pyvista/setup-headless-display-action@v4
    - name: Test with pytest
      run: |
        pytest
